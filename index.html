<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark Sky Tonight</title>
<meta name="application-name" content="Dark Sky Tonight">
<meta name="description" content="Where Earth sits in the galaxy tonight, from Coonabarabran.">
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tonight">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./favicon.svg">
<style>
  html,body{margin:0;height:100%;background:#07090f;color:#f3efe4;font-family:Figtree,system-ui,sans-serif}
  .bar{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#07090fd9;backdrop-filter:blur(8px);font-size:13px}
  .bar b{letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .bar button{color:#7ec8d4;margin-left:auto;background:none;border:0;font:inherit;cursor:pointer}
  iframe{position:fixed;inset:44px 0 0 0;width:100%;height:calc(100% - 44px);border:0;background:#07090f}
</style>
</head>
<body>
  <div class="bar">
    <b>Dark Sky Tonight</b>
    <span>Dark Sky Hub</span>
    <button type="button" id="fullBtn">Open full screen</button>
  </div>
  <iframe id="skyFrame" title="Dark Sky Tonight" src="https://grove-plum-gem-turbo.grok.me/?v=20260901" allow="fullscreen"></iframe>
  <script>
    document.getElementById('fullBtn').addEventListener('click', function () {
      var frame = document.getElementById('skyFrame');
      if (frame.requestFullscreen) frame.requestFullscreen();
      else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
